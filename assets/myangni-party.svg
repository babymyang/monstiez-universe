<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="title desc">
  <title id="title">Myangni party expression — MONSTIEZ Universe mascot</title>
  <desc id="desc">An original chibi black cat mascot with pink inner ears, rosy cheeks, bright eyes, tiny paws, a crown and a heart.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#34313f"/><stop offset="1" stop-color="#171923"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8cba"/><stop offset="1" stop-color="#ff4c96"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#ba6d98" flood-opacity=".2"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <ellipse cx="160" cy="266" rx="100" ry="16" fill="#f2c6dc" opacity=".65"/>
    <!-- tail -->
    <path d="M229 209 C278 202 287 158 260 147 C241 139 229 155 239 168" fill="none" stroke="#24232f" stroke-width="19" stroke-linecap="round"/>
    <path d="M229 209 C278 202 287 158 260 147" fill="none" stroke="#403d4c" stroke-width="6" stroke-linecap="round" opacity=".75"/>
    <!-- ears and head silhouette -->
    <path d="M70 110 L54 40 Q53 30 64 36 L119 70 Q160 52 201 70 L254 37 Q266 29 264 44 L249 111 Q273 145 264 188 Q253 239 207 247 L113 247 Q67 237 55 194 Q45 150 70 110Z" fill="url(#fur)" stroke="#11121a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M69 53 L108 78 L82 112Z" fill="url(#pink)" stroke="#11121a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M249 53 L211 78 L235 112Z" fill="url(#pink)" stroke="#11121a" stroke-width="3" stroke-linejoin="round"/>
    <!-- forehead fluff -->
    <path d="M107 74 Q122 89 138 76 Q148 91 162 77 Q178 90 191 75 Q208 91 216 106 Q194 97 181 106 Q160 96 143 106 Q122 96 102 109Z" fill="#3d394a"/>
    <!-- face: cheering closed eyes and open celebratory mouth -->
    <path d="M94 158 Q118 135 143 158" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M177 158 Q202 135 226 158" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M97 158 Q119 141 140 158 M180 158 Q202 141 223 158" fill="none" stroke="#191c2a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="160" cy="208" rx="14" ry="11" fill="#7a2b4a" stroke="#171923" stroke-width="2.6"/>
    <ellipse cx="160" cy="214" rx="8" ry="4.5" fill="#ff7fae"/>
    <!-- cheeks -->
    <ellipse cx="92" cy="190" rx="21" ry="11" fill="#ff83ae" opacity=".72"/>
    <ellipse cx="228" cy="190" rx="21" ry="11" fill="#ff83ae" opacity=".72"/>
    <path d="M150 190 Q160 199 170 190 Q160 206 150 190Z" fill="#ff8cae" stroke="#171923" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M146 196 Q160 204 174 196" fill="none" stroke="#171923" stroke-width="2.6" stroke-linecap="round" opacity=".0"/>

    <!-- paws -->
    <ellipse cx="123" cy="241" rx="35" ry="23" fill="#f8f4f8" stroke="#191a24" stroke-width="4"/>
    <ellipse cx="197" cy="241" rx="35" ry="23" fill="#f8f4f8" stroke="#191a24" stroke-width="4"/>
    <path d="M114 242 Q120 247 126 242 M187 242 Q193 247 199 242" fill="none" stroke="#f38db6" stroke-width="3" stroke-linecap="round"/>
    <!-- little crown -->
    <path d="M121 50 L113 21 L140 37 L160 9 L180 37 L207 21 L199 51Z" fill="#ffd7ec" stroke="#1d1d28" stroke-width="4" stroke-linejoin="round"/>
    <path d="M126 43 L194 43" stroke="#ff4b98" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="28" r="4" fill="#ff4b98"/>
    <!-- heart floating -->
    <path d="M260 90 C248 74 229 87 238 102 L260 122 L282 102 C291 87 272 74 260 90Z" fill="url(#pink)" stroke="#282431" stroke-width="3" stroke-linejoin="round"/>
    <path d="M250 91 Q244 89 244 96" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- twinkles -->
    <path d="M43 143 L48 155 L60 160 L48 165 L43 177 L38 165 L26 160 L38 155Z" fill="#ffc75e" stroke="#292634" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M280 209 L284 218 L293 222 L284 226 L280 235 L276 226 L267 222 L276 218Z" fill="#bfa6ff" stroke="#292634" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- party hat and confetti -->
    <path d="M228 44 L262 12 L272 58Z" fill="#8d72d9" stroke="#2b2540" stroke-width="3.4" stroke-linejoin="round"/>
    <circle cx="264" cy="10" r="6.5" fill="#ff4f9a" stroke="#2b2540" stroke-width="2.6"/>
    <path d="M234 38 L252 24 M242 45 L258 34" stroke="#ffd7ec" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="92" r="5" fill="#ff8cba"/>
    <circle cx="292" cy="146" r="4.5" fill="#19b995"/>
    <path d="M56 60 L60 68 L52 68Z" fill="#ffb83f" stroke="#292634" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M286 62 L292 54 L298 62Z" fill="#ff4f9a" stroke="#292634" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="30" y="216" width="9" height="9" rx="2" fill="#8d72d9" transform="rotate(18 34 220)"/>
    <rect x="276" y="186" width="8" height="8" rx="2" fill="#ff8cba" transform="rotate(-14 280 190)"/>

  </g>
</svg>
