<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · MONSTIEZ Universe</title>
  <style>
    body {
      margin: 0;
      font-family: "Nunito Sans", ui-rounded, system-ui, sans-serif;
      background: linear-gradient(175deg, #FBE0EE 0%, #F6CDE0 34%, #EFDDF7 62%, #FFF9FC 100%);
      color: #38293A;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 800; margin: 16px 0 8px; }
    p { font-size: 14px; color: #6E5A70; max-width: 30ch; line-height: 1.5; }
    .badge {
      width: 64px; height: 64px; border-radius: 50%;
      background: #fff; border: 1px solid rgba(56,41,58,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    .heart { color: #FF4F9A; }
  </style>
</head>
<body>
  <div class="badge" aria-hidden="true">🐱</div>
  <h1>You're offline</h1>
  <p>The app shell is cached. Live content links need a connection.</p>
  <p class="heart">A fan-made app for MONSTIEZ ♡</p>
</body>
</html>
